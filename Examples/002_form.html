<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>フォームの例</title>
</head>
<body>
  <h1>ユーザー登録</h1>
  <p>ユーザー登録でこのサイトをもっと便利に使えます</p>

  <div>
    <label for="email">Eメール</label>
    <input id="email" type="email" />
  </div>
  
  <div>
    <label for="password">パスワード</label>
    <input id="password" type="password" />
  </div>

  <div>
    <label>
      <input type="checkbox" />
      利用規約に同意
    </label>
  </div>

  <button type="submit">送信</button>
</body>
</html>
